name: Daily House Report

on:
  schedule:
    - cron: "0 13 * * *"  # 13:00 UTC = 6am Pacific / 9am Eastern (adjust to taste)
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a new run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: house_scout
        run: pip install -r requirements.txt

      - name: Run search (realtor.com; Redfin is expected to fail from GH-hosted runners)
        working-directory: house_scout
        run: python -m house_scout.main --config inspirada_unicorn.yaml

      - name: Locate the report CSV just written
        id: find_csv
        working-directory: house_scout
        run: |
          latest=$(ls -t reports/*.csv | head -n 1)
          echo "Found $latest"
          echo "csv=$latest" >> "$GITHUB_OUTPUT"

      - name: Download photos + build ranking report
        working-directory: house_scout
        run: |
          python -m house_scout.photo_report \
            --report "${{ steps.find_csv.outputs.csv }}" \
            --out site_build \
            --max-photos 10

      - name: Assemble Pages site (slide deck as the homepage)
        working-directory: house_scout
        run: |
          mkdir -p ../site
          cp site_build/slide_deck.html ../site/index.html
          cp site_build/ranking_report.md ../site/ranking_report.md
          cp -r site_build/photos ../site/photos
          cp "${{ steps.find_csv.outputs.csv }}" ../site/report.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
