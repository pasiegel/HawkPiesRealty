# House Scout search configuration - this repo runs exactly one search, defined here.
# Easiest way to fill this in for a NEW repo/area: open config_builder.html in a browser,
# fill out the form, download config.yaml, and drop it in here (overwriting this file).
# Manual edits work too - then run: python -m house_scout.main

location: "Inspirada, Henderson, NV"  # city/state, ZIP, or a specific street address
radius_miles: 10                      # straight-line radius (not drive time); only applies when location is a specific address
listing_type: "for_sale"              # for_sale, for_rent, sold, pending
past_days: 60                         # listings from the last N days (list date for for_sale)
active_only: true                     # exclude pending/contingent/under-contract/sold listings

# Sources to query
sources:
  realtor: true
  redfin: true

# Property filters (applied to both sources; leave null to skip a filter)
price_min: null
price_max: 620000
stretch_price_max: 650000  # also include listings above price_max, up to here, if they've
                            # sat on the market stretch_dom_min+ days (flagged in the report)
stretch_dom_min: 45
beds_min: 4
beds_max: null
baths_min: 2               # counts a half-bath as 0.5
baths_max: null
full_baths_min: 2          # stricter: N FULL baths only (realtor.com data only, see README)
sqft_min: 2000
sqft_max: null
lot_sqft_min: null
lot_sqft_max: null
year_built_min: null
year_built_max: null
property_types: null           # e.g. ["single_family", "townhomes"] - realtor.com only
excluded_property_types: ["mobile"]  # applied client-side, both sources

# Output
output_dir: "reports"
report_basename: "inspirada_unicorn"  # date/time gets appended automatically

proxy: null                # e.g. "http://user:pass@host:port" - used by both sources
